name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          stripdown: true

      - name: Fix MSVC PDB parallel write (C1041)
        run: |
          "CFLAGS=/FS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXXFLAGS=/FS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "KiriSub ${{ github.ref_name }}"
          releaseBody: "請下載 KiriSub_*_x64-setup.exe 安裝。安裝後軟體會自動檢查更新。"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
